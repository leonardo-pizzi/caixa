<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caixa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="rail" id="rail" aria-label="Navegação principal"></nav>
    <main class="main"><div id="view"></div></main>
  </div>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-label="Lançamento"></aside>
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="boot" class="boot">Abrindo o caixa…</div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- A ordem importa: js/app.js por último. -->
  <script src="js/util.js"></script>
  <script src="js/dominio.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/telas/base.js"></script>
  <script src="js/telas/fluxo.js"></script>
  <script src="js/telas/lancamentos.js"></script>
  <script src="js/telas/cartoes.js"></script>
  <script src="js/telas/analise.js"></script>
  <script src="js/formularios/lancamento.js"></script>
  <script src="js/formularios/fixa.js"></script>
  <script src="js/formularios/janelas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
